<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c1d2b;--muted:#5f6478;--red1:#e8413b;--red2:#c41f3a;--line:#e1e4ef}
@media (prefers-color-scheme:dark){:root{--bg:#12131c;--card:#1c1e2b;--ink:#eef0f8;--muted:#a2a7bd;--line:#2e3145}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--card);border-radius:20px;padding:28px 22px;width:min(100%,360px);box-shadow:0 8px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:12px;text-align:center}
.seal{width:56px;height:56px;margin:0 auto;border-radius:14px;background:linear-gradient(120deg,var(--red1),var(--red2));color:#fff;display:grid;place-items:center;font-size:30px;transform:rotate(-6deg)}
h1{margin:4px 0 0;font-size:22px}p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--red2);color:#fff;cursor:pointer}
label{font-size:14px;color:var(--muted);display:flex;gap:8px;justify-content:center;align-items:center}
#err{color:var(--red1);min-height:1.2em;font-size:14px}
</style></head><body>
